services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      APP_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_WS_URL: "ws://localhost:8080/ws"
    depends_on:
      - server
